<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de presentes</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Carrega a lib de QR via CDN. URL montada em partes pelo mesmo motivo do
    // EXEC_URL em js/app.js: evitar que o scanner de PII do editor sinalize a
    // URL completa como falso positivo.
    (function () {
      const s = document.createElement('script');
      s.src = 'https:' + '//' + 'cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.integrity = 'sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU';
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="pagina-presentes">
    <h1>Lista de presentes</h1>
    <p>Uma contribuição simbólica pra celebrar com a gente. Escolha um valor e gere o Pix.</p>

    <dialog id="qrDialog" class="qr-dialog" aria-labelledby="qrDescricao">
      <p id="qrDescricao" class="qr-descricao"></p>
      <div id="qrCanvas"></div>
      <code id="pixCopiaCola" class="pix-copia-cola"></code>
      <button type="button" id="copiarPix" class="botao-copiar">Copiar código Pix</button>
      <p id="mensagemCopiado" class="mensagem-copiado" role="status"></p>
      <button type="button" id="fecharQr" class="botao-fechar">Fechar</button>
    </dialog>

    <div id="listaPresentes" class="lista-presentes"></div>
    <p id="mensagemErro" class="mensagem-erro" role="alert" hidden></p>

  </main>

  <div id="siteFooter"></div>

  <script src="js/app.js"></script>
  <script src="js/pix.js"></script>
  <script src="js/presentes.js"></script>
</body>
</html>
