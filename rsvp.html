<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar presença</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="siteHeader"></div>

  <main>
    <h1>Confirme sua presença</h1>

    <form id="formRsvp" novalidate>
      <div class="campo">
        <label for="nome">Seu nome</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="nome" name="nome" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" required>
          <ul class="sugestoes-nome" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="campo">
        <label for="telefone">Telefone (WhatsApp)</label>
        <input type="tel" id="telefone" name="telefone" placeholder="DDD + número" required>
      </div>

      <div id="blocoAcompanhantes">
        <div class="campo">
          <label for="qtdAcompanhantes">Quantos acompanhantes?</label>
          <input type="number" id="qtdAcompanhantes" name="qtdAcompanhantes" min="0" max="10" value="0">
        </div>

        <div id="acompanhantesContainer"></div>
      </div>

      <div class="campo">
        <span class="rotulo-presenca">Você vai comparecer?</span>
        <div class="presenca-opcoes" role="radiogroup" aria-label="Presença do convidado">
          <label class="presenca-opcao">
            <input type="radio" name="presenca" value="sim" checked> Sim, vou
          </label>
          <label class="presenca-opcao">
            <input type="radio" name="presenca" value="nao"> Não vou
          </label>
        </div>
      </div>

      <button type="submit" id="botaoEnviar">Enviar resposta</button>
      <p id="mensagemErro" class="mensagem-erro" role="alert" hidden></p>
    </form>

    <div id="confirmacao" hidden>
      <p class="mensagem-sucesso" id="mensagemConfirmacao">Resposta enviada! Obrigado 💛</p>
    </div>

  </main>

  <div id="siteFooter"></div>

  <script src="js/app.js"></script>
  <script src="js/rsvp.js"></script>
</body>
</html>
