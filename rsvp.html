<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar presença</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <nav><a href="index.html">&larr; Início</a></nav>
    <h1>Confirme sua presença</h1>

    <form id="formRsvp">
      <div class="campo">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" name="nome" list="listaConvidados" autocomplete="off" required>
        <datalist id="listaConvidados"></datalist>
      </div>

      <div class="campo">
        <label for="telefone">Telefone (WhatsApp)</label>
        <input type="tel" id="telefone" name="telefone" placeholder="DDD + número" required>
      </div>

      <div class="campo">
        <label for="qtdAcompanhantes">Quantos acompanhantes?</label>
        <input type="number" id="qtdAcompanhantes" name="qtdAcompanhantes" min="0" max="10" value="0">
      </div>

      <div id="acompanhantesContainer"></div>

      <div class="campo">
        <label>Vai querer churrasco?</label>
        <div class="opcoes-sim-nao">
          <label><input type="radio" name="churrasco" value="sim" required> Sim</label>
          <label><input type="radio" name="churrasco" value="nao"> Não</label>
        </div>
      </div>

      <div class="campo">
        <label>Vai querer bebida?</label>
        <div class="opcoes-sim-nao">
          <label><input type="radio" name="bebida" value="sim" required> Sim</label>
          <label><input type="radio" name="bebida" value="nao"> Não</label>
        </div>
      </div>

      <button type="submit" id="botaoEnviar">Confirmar presença</button>
      <p id="mensagemErro" class="mensagem-erro" hidden></p>
    </form>

    <div id="confirmacao" hidden>
      <p class="mensagem-sucesso">Presença confirmada! Obrigado 💛</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/rsvp.js"></script>
</body>
</html>
